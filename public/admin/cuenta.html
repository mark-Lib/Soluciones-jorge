<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta · Panel · Soluciones Jorge</title>
<link rel="icon" href="/img/favicon-32.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="admin-shell">
  <div class="admin-topbar">
    <a href="/" class="brand"><img src="/img/logo.png" alt="Soluciones Jorge" style="height:34px"><span class="brand-text">Soluciones Jorge<small>Panel de Jorge</small></span></a>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="/" class="btn btn-outline btn-sm">Ver sitio</a>
      <button class="btn btn-outline btn-sm" id="logout-btn">Cerrar sesión</button>
    </div>
  </div>
  <nav class="admin-nav">
    <a href="/admin/index.html">Piezas</a>
    <a href="/admin/marcas.html">Marcas y modelos</a>
    <a href="/admin/categorias.html">Categorías</a>
    <a href="/admin/citas.html">Citas del taller</a>
    <a href="/admin/solicitudes.html">Solicitudes de piezas</a>
    <a href="/admin/testimonios.html">Testimonios</a>
    <a href="/admin/blog.html">Blog</a>
    <a href="/admin/publicaciones.html">Publicaciones</a>
    <a href="/admin/secciones-publicaciones.html">Secciones de publicaciones</a>
    <a href="/admin/cuenta.html">Mi cuenta</a>
  </nav>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Mi cuenta</h1>
    </div>

    <div class="form-card" style="max-width:420px">
      <h2 style="font-size:16px">Cambiar contraseña</h2>
      <p class="sub">El usuario siempre es "jorge" — solo puedes cambiar la contraseña.</p>
      <div class="form-error" id="pw-error"></div>
      <div class="form-success" id="pw-success"></div>
      <form id="pw-form">
        <div class="field">
          <label for="current-password">Contraseña actual</label>
          <input type="password" id="current-password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="new-password">Nueva contraseña</label>
          <input type="password" id="new-password" autocomplete="new-password" minlength="6" required placeholder="Mínimo 6 caracteres">
        </div>
        <div class="field">
          <label for="new-password-confirm">Repite la nueva contraseña</label>
          <input type="password" id="new-password-confirm" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="pw-btn">Guardar nueva contraseña</button>
      </form>
    </div>
  </main>
</div>

<script src="/js/admin-common.js"></script>
<script>
(async () => {
  const ok = await SJAdmin.requireSession();
  if (!ok) return;

  document.getElementById('pw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('pw-error');
    const okBox = document.getElementById('pw-success');
    errBox.classList.remove('show');
    okBox.classList.remove('show');

    const currentPassword = document.getElementById('current-password').value;
    const newPassword = document.getElementById('new-password').value;
    const confirm = document.getElementById('new-password-confirm').value;

    if (newPassword !== confirm) {
      errBox.textContent = 'Las dos contraseñas nuevas no coinciden.';
      errBox.classList.add('show');
      return;
    }

    const btn = document.getElementById('pw-btn');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const res = await fetch('/api/admin/password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword, newPassword })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'No se pudo cambiar la contraseña');
      document.getElementById('pw-form').reset();
      okBox.textContent = 'Listo — tu contraseña se actualizó correctamente.';
      okBox.classList.add('show');
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar nueva contraseña';
    }
  });
})();
</script>
</body>
</html>
